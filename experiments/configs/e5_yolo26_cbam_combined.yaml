# Ultralytics YOLO26 - Experiment E5: Combined Attention (Backbone + Neck)
# Simultaneous attention in both feature extraction (Backbone) and aggregation (Neck)

nc: 80 # Will be overridden by dataset nc (e.g., 2)
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone with 3x CBAM
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3 - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 - backbone P3
  - [-1, 1, CBAM, []] # 5 - CBAM on backbone P3
  - [-1, 1, Conv, [512, 3, 2]] # 6 - P4/16 downsample
  - [-1, 2, C3k2, [512, True]] # 7 - backbone P4
  - [-1, 1, CBAM, []] # 8 - CBAM on backbone P4
  - [-1, 1, Conv, [1024, 3, 2]] # 9 - P5/32 downsample
  - [-1, 2, C3k2, [1024, True]] # 10 - backbone P5
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 11 - SPPF
  - [-1, 2, C2PSA, [1024]] # 12 - C2PSA
  - [-1, 1, CBAM, []] # 13 - CBAM on backbone P5

# Head with 3x Neck CBAM
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 8], 1, Concat, [1]] # 15 - cat backbone CBAM P4 (layer 8)
  - [-1, 2, C3k2, [512, True]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 5], 1, Concat, [1]] # 18 - cat backbone CBAM P3 (layer 5)
  - [-1, 2, C3k2, [256, True]] # 19 - neck P3
  - [-1, 1, CBAM, []] # 20 - CBAM on neck P3 (small object branch)

  - [-1, 1, Conv, [256, 3, 2]] # 21 - downsample
  - [[-1, 16], 1, Concat, [1]] # 22 - cat neck P4 (layer 16)
  - [-1, 2, C3k2, [512, True]] # 23 - neck P4
  - [-1, 1, CBAM, []] # 24 - CBAM on neck P4 (medium object branch)

  - [-1, 1, Conv, [512, 3, 2]] # 25 - downsample
  - [[-1, 13], 1, Concat, [1]] # 26 - cat backbone CBAM P5 (layer 13)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 27 - neck P5
  - [-1, 1, CBAM, []] # 28 - CBAM on neck P5 (large object branch)

  - [[20, 24, 28], 1, Detect, [nc]] # 29 - Detect(CBAM_P3, CBAM_P4, CBAM_P5)
