# Ultralytics YOLO26 - Experiment E4: Neck Attention (CBAM on Neck branches)
# Location comparison: Evaluates attention placed inside Neck before Detect head

nc: 80 # Will be overridden by dataset nc (e.g., 2)
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Standard YOLO26 backbone (No CBAM)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3 - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 - backbone P3
  - [-1, 1, Conv, [512, 3, 2]] # 5 - P4/16
  - [-1, 2, C3k2, [512, True]] # 6 - backbone P4
  - [-1, 1, Conv, [1024, 3, 2]] # 7 - P5/32
  - [-1, 2, C3k2, [1024, True]] # 8 - backbone P5
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9 - SPPF
  - [-1, 2, C2PSA, [1024]] # 10 - backbone end

# YOLO26 head with Neck CBAM
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 - cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 - cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 - neck P3
  - [-1, 1, CBAM, []] # 17 - CBAM on neck P3 (small object branch)

  - [-1, 1, Conv, [256, 3, 2]] # 18 - downsample
  - [[-1, 13], 1, Concat, [1]] # 19 - cat neck P4
  - [-1, 2, C3k2, [512, True]] # 20 - neck P4
  - [-1, 1, CBAM, []] # 21 - CBAM on neck P4 (medium object branch)

  - [-1, 1, Conv, [512, 3, 2]] # 22 - downsample
  - [[-1, 10], 1, Concat, [1]] # 23 - cat backbone P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24 - neck P5
  - [-1, 1, CBAM, []] # 25 - CBAM on neck P5 (large object branch)

  - [[17, 21, 25], 1, Detect, [nc]] # 26 - Detect(CBAM_P3, CBAM_P4, CBAM_P5)
