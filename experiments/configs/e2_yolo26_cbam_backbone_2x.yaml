# Ultralytics YOLO26 - Experiment E2: 2x Backbone Attention (CBAM at P4, P5)
# Multiple attention applied to medium and high semantic scales

nc: 80 # Will be overridden by dataset nc (e.g., 2)
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26 backbone with 2x CBAM
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3 - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 - backbone P3
  - [-1, 1, Conv, [512, 3, 2]] # 5 - P4/16
  - [-1, 2, C3k2, [512, True]] # 6 - backbone P4
  - [-1, 1, CBAM, []] # 7 - CBAM on P4 (1st attention)
  - [-1, 1, Conv, [1024, 3, 2]] # 8 - P5/32 downsample
  - [-1, 2, C3k2, [1024, True]] # 9 - backbone P5
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 10 - SPPF
  - [-1, 2, C2PSA, [1024]] # 11 - C2PSA
  - [-1, 1, CBAM, []] # 12 - CBAM on P5 (2nd attention)

# YOLO26 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 7], 1, Concat, [1]] # 14 - cat CBAM P4 (layer 7)
  - [-1, 2, C3k2, [512, True]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 4], 1, Concat, [1]] # 17 - cat backbone P3 (layer 4)
  - [-1, 2, C3k2, [256, True]] # 18 - neck P3 output

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20 - cat neck P4 (layer 15)
  - [-1, 2, C3k2, [512, True]] # 21 - neck P4 output

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23 - cat CBAM P5 (layer 12)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24 - neck P5 output

  - [[18, 21, 24], 1, Detect, [nc]] # 25 - Detect(P3, P4, P5)
