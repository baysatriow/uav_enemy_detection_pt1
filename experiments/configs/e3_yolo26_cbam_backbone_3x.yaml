# Ultralytics YOLO26 - Experiment E3: 3x Backbone Attention (CBAM at P3, P4, P5)
# Attention depth across all multi-scale feature hierarchies in the backbone

nc: 80 # Will be overridden by dataset nc (e.g., 2)
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26 backbone with 3x CBAM
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3 - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 - backbone P3
  - [-1, 1, CBAM, []] # 5 - CBAM on P3 (1st attention)
  - [-1, 1, Conv, [512, 3, 2]] # 6 - P4/16 downsample
  - [-1, 2, C3k2, [512, True]] # 7 - backbone P4
  - [-1, 1, CBAM, []] # 8 - CBAM on P4 (2nd attention)
  - [-1, 1, Conv, [1024, 3, 2]] # 9 - P5/32 downsample
  - [-1, 2, C3k2, [1024, True]] # 10 - backbone P5
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 11 - SPPF
  - [-1, 2, C2PSA, [1024]] # 12 - C2PSA
  - [-1, 1, CBAM, []] # 13 - CBAM on P5 (3rd attention)

# YOLO26 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 8], 1, Concat, [1]] # 15 - cat CBAM P4 (layer 8)
  - [-1, 2, C3k2, [512, True]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 5], 1, Concat, [1]] # 18 - cat CBAM P3 (layer 5)
  - [-1, 2, C3k2, [256, True]] # 19 - neck P3 output

  - [-1, 1, Conv, [256, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 - cat neck P4 (layer 16)
  - [-1, 2, C3k2, [512, True]] # 22 - neck P4 output

  - [-1, 1, Conv, [512, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 - cat CBAM P5 (layer 13)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 25 - neck P5 output

  - [[19, 22, 25], 1, Detect, [nc]] # 26 - Detect(P3, P4, P5)
