# Ultralytics YOLO26 - Experiment E1: 1x Backbone Attention (CBAM at P5)
# Single attention at deepest semantic stage (P5)

nc: 80 # Will be overridden by dataset nc (e.g., 2)
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26 backbone with 1x CBAM
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3 - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 - backbone P3
  - [-1, 1, Conv, [512, 3, 2]] # 5 - P4/16
  - [-1, 2, C3k2, [512, True]] # 6 - backbone P4
  - [-1, 1, Conv, [1024, 3, 2]] # 7 - P5/32
  - [-1, 2, C3k2, [1024, True]] # 8 - backbone P5
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9 - SPPF
  - [-1, 2, C2PSA, [1024]] # 10 - C2PSA
  - [-1, 1, CBAM, []] # 11 - CBAM on P5 (1x Backbone attention)

# YOLO26 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]] # 13 - cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]] # 16 - cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 17 - neck P3 output

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # 19 - cat neck P4
  - [-1, 2, C3k2, [512, True]] # 20 - neck P4 output

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 11], 1, Concat, [1]] # 22 - cat CBAM P5 (layer 11)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 - neck P5 output

  - [[17, 20, 23], 1, Detect, [nc]] # 24 - Detect(P3, P4, P5)
